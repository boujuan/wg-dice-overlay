<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>W&G — Mini lanzador</title>
<style>
:root {
  --bg: #161310; --panel-2: #2a231a; --ochre: #b3924a; --gold: #e9c46a;
  --text: #e6dcc4; --dim: #9a8f76; --line: #3d352a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text);
  font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; user-select: none; }
body { display: flex; flex-direction: column; }

#mhead {
  display: flex; justify-content: space-between; align-items: center;
  padding: 5px 6px 5px 10px; background: #12100d; border-bottom: 1px solid var(--line);
  -webkit-app-region: drag;
}
#mhead .t { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
#mclose {
  -webkit-app-region: no-drag;
  width: 22px; height: 22px; line-height: 1;
  background: none; border: none; color: var(--dim);
  font-size: 12px; cursor: pointer;
}
#mclose:hover { color: #fff; background: #c0392b; }

.mmodes { display: flex; gap: 4px; padding: 8px 8px 0; -webkit-app-region: no-drag; }
.mtab {
  flex: 1; padding: 6px 0; background: var(--panel-2); color: var(--dim);
  border: 1px solid var(--line); cursor: pointer;
  font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase;
}
.mtab.active { background: var(--ochre); color: #16120a; font-weight: 700; }

.mrow { display: flex; gap: 8px; padding: 8px 8px 0; -webkit-app-region: no-drag; }
.mrow label {
  flex: 1; display: flex; align-items: center; gap: 6px;
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim);
}
.mrow input {
  width: 100%; min-width: 0; flex: 1; padding: 7px 4px; text-align: center;
  background: #14100c; color: var(--gold); border: 1px solid var(--line);
  font-size: 17px; font-weight: 700; outline: none;
  -moz-appearance: textfield;
}
.mrow input::-webkit-outer-spin-button,
.mrow input::-webkit-inner-spin-button { -webkit-appearance: none; }

#btn-roll {
  margin: 8px 8px 0; padding: 12px 0;
  background: linear-gradient(180deg, #d9a441, #b57f22);
  border: none; cursor: pointer;
  font-size: 16px; font-weight: 800; letter-spacing: .16em; color: #16120a;
  -webkit-app-region: no-drag;
}
#btn-roll:hover { filter: brightness(1.1); }
#btn-roll:active { transform: translateY(1px); }

.mrow2 { display: flex; gap: 6px; padding: 8px 8px 8px; -webkit-app-region: no-drag; }
#btn-repeat {
  padding: 7px 10px; background: var(--panel-2); color: var(--text);
  border: 1px solid var(--line); cursor: pointer; font-size: 11.5px;
}
#btn-repeat:hover { border-color: var(--ochre); color: var(--gold); }
#mpresets {
  flex: 1; min-width: 0; padding: 7px 6px; font-size: 12px;
  background: #14100c; color: var(--text); border: 1px solid var(--line); outline: none;
}

#mhint { padding: 0 10px 7px; font-size: 10px; color: var(--dim); text-align: center;
  letter-spacing: .06em; -webkit-app-region: no-drag; }
.hidden { display: none !important; }
</style>
</head>
<body>
  <div id="mhead">
    <span class="t">🎲 Tiradas W&amp;G</span>
    <button id="mclose" title="Cerrar mini lanzador">✕</button>
  </div>

  <div class="mmodes">
    <button class="mtab active" data-mode="test">Test</button>
    <button class="mtab" data-mode="damage">Daño</button>
    <button class="mtab" data-mode="free">Libre</button>
  </div>

  <div class="mrow" id="mpanel-test">
    <label>Dados <input id="pool" type="number" min="1" max="20" value="5"></label>
    <label>DN <input id="dn" type="number" min="1" max="10" value="2"></label>
  </div>
  <div class="mrow hidden" id="mpanel-damage">
    <label>Base <input id="base" type="number" min="0" max="99" value="7"></label>
    <label>ED <input id="ed" type="number" min="1" max="20" value="2"></label>
  </div>
  <div class="mrow hidden" id="mpanel-free">
    <label>Dados <input id="pool2" type="number" min="1" max="20" value="2"></label>
  </div>

  <button id="btn-roll">🎲 LANZAR</button>

  <div class="mrow2">
    <button id="btn-repeat" title="Repetir última tirada (R)">↺ Repetir</button>
    <select id="mpresets"><option value="">Presets…</option></select>
  </div>
  <div id="mhint">Espacio = lanzar · R = repetir · flota siempre encima</div>

  <script src="mini.js"></script>
</body>
</html>
